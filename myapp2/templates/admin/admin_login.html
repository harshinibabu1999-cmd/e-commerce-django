{% extends "base.html" %}
{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #6c8cd5, #4a6cf7);
        font-family: Arial, sans-serif;
    }

    .login-container {
        width: 350px;
        margin: 120px auto;
        padding: 40px;
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        text-align: center;
    }

    .login-container h2 {
        margin-bottom: 25px;
        color: #2c3e50;
    }

    .login-container input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    .login-container input:focus {
        border-color: #4a6cf7;
        outline: none;
    }

    .login-container button {
        width: 100%;
        padding: 10px;
        background-color: #4a6cf7;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s ease;
    }

    .login-container button:hover {
        background-color: #2f4cd8;
    }

    .error-message {
        color: red;
        margin-top: 10px;
        font-size: 14px;
    }
</style>

<div class="login-container">
    <h2>Admin Login</h2>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}
</div>
{% endblock %}
