{% extends "base.html" %}
{% block content %}

<style>
    .delete-container {
        max-width: 400px;
        margin: 80px auto;
        background: #ffffff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        text-align: center;
    }

    .delete-container h2 {
        color: #dc3545;
        margin-bottom: 15px;
    }

    .delete-container p {
        color: #555;
        margin-bottom: 25px;
        font-size: 15px;
    }

    .delete-actions {
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }

    .delete-actions button,
    .delete-actions a {
        flex: 1;
        padding: 10px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
    }

    .btn-delete {
        background: #dc3545;
        color: white;
        border: none;
    }

    .btn-delete:hover {
        background: #bb2d3b;
    }

    .btn-cancel {
        background: #6c757d;
        color: white;
    }

    .btn-cancel:hover {
        background: #5c636a;
    }
</style>

<div class="delete-container">
    <h2>Confirm Delete</h2>

    <p>
        Are you sure you want to delete this item?
        <br>
        <strong>This action cannot be undone.</strong>
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="delete-actions">
            <button type="submit" class="btn-delete">Yes, Delete</button>
            <a href="{% url 'myapp:product_list' %}" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
