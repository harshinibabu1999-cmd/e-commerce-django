{% extends "base.html" %}
{% block content %}

<style>
    .add-product-container {
        max-width: 420px;
        margin: 40px auto;
        background: #ffffff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.12);
    }

    .add-product-container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    .add-product-container label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
        color: #555;
    }

    .add-product-container input[type="text"],
    .add-product-container input[type="number"],
    .add-product-container input[type="file"],
    .add-product-container textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 15px;
        font-size: 14px;
    }

    .add-product-container textarea {
        resize: none;
        height: 80px;
    }

    .add-product-container button {
        width: 100%;
        background:tomato;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .add-product-container button:hover {
        background: lightcoral;
    }
</style>

<div class="add-product-container">
    <h2>Add Product</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
     
        <label>Image</label>
        <input type="file" name="image" required>

        <label>Product Name</label>
        <input type="text" name="product_name" required>

        <label>Quantity</label>
        <input type="text" name="quantity" required>

        <label>Price</label>
        <input type="number" name="price" required>

        <label>Description</label>
        <textarea name="description" required></textarea>

        <button type="submit">Add Product</button>
        
    </form>
</div>

{% endblock %}
