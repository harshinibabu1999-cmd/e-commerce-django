{% extends 'base.html' %}

{% block content %}

<style>

.register-container{
    max-width:700px;
    margin:20px auto;
}

.register-card{
    background:white;
    padding:30px;

    border-radius:16px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.08);
}

.register-title{
    text-align:center;

    font-size:28px;
    font-weight:600;

    color:#1e3a8a;

    margin-bottom:25px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;

    font-size:14px;
    font-weight:500;

    color:#444;

    margin-bottom:7px;
}

.form-group input,
.form-group textarea{
    width:100%;

    padding:11px 13px;

    border:1px solid #d7dbea;

    border-radius:8px;

    font-size:14px;

    outline:none;

    transition:0.3s;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#355dc2;

    box-shadow:
        0 0 0 3px rgba(53,93,194,0.10);
}

.form-group textarea{
    min-height:90px;

    resize:vertical;
}

.form-row{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;
}

.register-btn{
    width:100%;

    padding:12px;

    border:none;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            #355dc2,
            #1e3a8a
        );

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;
}

.register-btn:hover{
    transform:translateY(-1px);

    box-shadow:
        0 5px 15px rgba(30,58,138,0.25);
}

.error-message{
    background:#fee2e2;

    color:#b91c1c;

    padding:10px;

    border-radius:8px;

    margin-bottom:18px;

    text-align:center;
}

@media(max-width:600px){

    .register-card{
        padding:20px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }

}

</style>


<div class="register-container">

    <div class="register-card">


        <div class="register-title">
            Create Account
        </div>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <!-- FIRST + LAST NAME -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        First Name
                    </label>

                    <input
                        type="text"
                        name="first_name"
                        placeholder="First name"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Last Name
                    </label>

                    <input
                        type="text"
                        name="last_name"
                        placeholder="Last name"
                    >

                </div>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter phone number"
                >

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label>
                    Address
                </label>

                <textarea
                    name="address"
                    placeholder="Enter your address"
                ></textarea>

            </div>


            <!-- CITY + STATE -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        City
                    </label>

                    <input
                        type="text"
                        name="city"
                        placeholder="Enter city"
                    >

                </div>


                <div class="form-group">

                    <label>
                        State
                    </label>

                    <input
                        type="text"
                        name="state"
                        placeholder="Enter state"
                    >

                </div>

            </div>


            <!-- COUNTRY -->

            <div class="form-group">

                <label>
                    Country
                </label>

                <input
                    type="text"
                    name="country"
                    placeholder="Enter country"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>


        </form>

    </div>

</div>

{% endblock %}
