{% extends 'base.html' %}
{% block content %}

<div class="confirm-container">
    <h2>Confirm Payment</h2>

    <div class="total-box">
        <h4>Total Amount: ₹ {{ total_amount }}</h4>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea name="address" required></textarea>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" required>
        </div>

        <div class="form-group">
            <label>Payment Method</label>
            <select name="payment_method" required>
                <option value="cod">Cash on Delivery</option>
                <option value="card">Debit / Credit Card</option>
                <option value="upi">UPI</option>
            </select>
        </div>

        <button type="submit" class="confirm-btn">
            Confirm & Pay
        </button>
    </form>
</div>

<style>
.confirm-container {
    width: 50%;
    margin: 40px auto;
    padding: 40px;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.order-summary {
    margin-bottom: 20px;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 6px;
}

.form-group {
    margin-bottom: 15px;
}

input, textarea, select {
    width: 100%;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.confirm-btn {
    width: 100%;
    padding: 10px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.confirm-btn:hover {
    background: #218838;
}
</style>

{% endblock %}
