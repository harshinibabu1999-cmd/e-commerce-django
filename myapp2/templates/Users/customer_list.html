{% extends 'base.html' %}

{% block content %}

<style>
    .customers-page {
        max-width: 1100px;
        margin: 40px auto;
        padding: 25px;
    }

    .customers-card {
        background: #ffffff;
        border-radius: 20px;
        padding: 35px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eeeeee;
    }

    .page-title {
        margin: 0;
        font-size: 30px;
        color: #1e3a8a;
        font-weight: 700;
    }

    .page-subtitle {
        margin: 7px 0 0;
        color: #888;
        font-size: 13px;
    }

    .customer-count {
        background: #e0e7ff;
        color: #355dc2;
        padding: 9px 15px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
    }

    .table-wrapper {
        width: 100%;
        overflow-x: auto;
        border-radius: 14px;
        border: 1px solid #eeeeee;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
    }

    table th {
        background: linear-gradient(135deg, #355dc2, #1e3a8a);
        color: white;
        padding: 15px 18px;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
    }

    table td {
        padding: 15px 18px;
        text-align: center;
        border-bottom: 1px solid #eeeeee;
        color: #555;
        font-size: 14px;
    }

    table tr:last-child td {
        border-bottom: none;
    }

    table tbody tr {
        transition: 0.25s ease;
    }

    table tbody tr:hover {
        background: #f7f9ff;
    }

    .user-id {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 35px;
        height: 30px;
        padding: 0 8px;
        border-radius: 8px;
        background: #eef2ff;
        color: #355dc2;
        font-weight: 600;
        font-size: 13px;
    }

    .username {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: #2c3e50;
        font-weight: 600;
    }

    .user-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #5774d2, #355dc2);
        color: white;
        font-size: 15px;
        font-weight: 600;
    }

    .empty-row td {
        padding: 35px;
        color: #999;
    }

    .empty-icon {
        display: block;
        font-size: 35px;
        margin-bottom: 8px;
    }

    @media (max-width: 650px) {
        .customers-page {
            margin: 20px auto;
            padding: 12px;
        }

        .customers-card {
            padding: 20px;
        }

        .page-header {
            align-items: flex-start;
            gap: 15px;
        }

        .page-title {
            font-size: 24px;
        }

        .customer-count {
            white-space: nowrap;
        }

        table th,
        table td {
            padding: 12px 10px;
        }
    }
</style>


<div class="customers-page">

    <div class="customers-card">

        <div class="page-header">

            <div>
                <h2 class="page-title">
                    Customers
                </h2>

                <p class="page-subtitle">
                    View all registered customers
                </p>
            </div>

            <div class="customer-count">
                👥 Customers
            </div>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Username</th>
                    </tr>
                </thead>

                <tbody>

                    {% for customer in customers %}

                    <tr>

                        <td>
                            <span class="user-id">
                                {{ customer.id }}
                            </span>
                        </td>

                        <td>
                            <span class="username">

                                <span class="user-avatar">
                                    {{ customer.username|first|upper }}
                                </span>

                                {{ customer.username }}

                            </span>
                        </td>

                    </tr>

                    {% empty %}

                    <tr class="empty-row">
                        <td colspan="2">
                            <span class="empty-icon">👤</span>
                            No customers found.
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
