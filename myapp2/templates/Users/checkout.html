{% extends "base.html" %}
{% block content %}

<div class="checkout-container">
    <h2>Checkout</h2>

    <div class="checkout-box">
        <h3>Payment Page</h3>
        <h4>Total Amount: ₹ {{ total_price }}</h4>
        <a href="{% url 'myapp2:confirm_payment' %}" class="checkout-btn">Proceed to Payment</a>
    </div>
</div>

<style>
.checkout-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 80vh;
}
.checkout-box {
    background: #ffffff;
    padding: 40px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
    width: 400px;
}
.checkout-box h3 {
    color: #333;
    margin-bottom: 20px;
}
.checkout-box h4 {
    color: #555;
    margin-bottom: 30px;
}
.checkout-btn {
    display: inline-block;
    padding: 10px 20px;
    background-color: #28a745;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    transition: 0.3s ease;
}
.checkout-btn:hover {
    background-color: #218838;
}
.cancel-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 8px 16px;
    background-color: #dc3545;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    transition: 0.3s ease;
}
.cancel-btn:hover {
    background-color: #c82333;
}
</style>

{% endblock %}
